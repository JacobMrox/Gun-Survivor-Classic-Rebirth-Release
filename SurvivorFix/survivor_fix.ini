; Survivor Fix - settings
; 1 = on, 0 = off. The file is re-read while the game runs (within a second).

[General]
Enable=1
; Writes survivor_fix.log in the game folder (attach it when reporting a problem).
Log=1

[Features]
; One walk cycle per zombie, as on PS1: no more jerky walk that keeps "resetting".
Ps1ZombieWalk=1
; PS1 chase: zombies steer while walking and go around walls (room data from
; Resource\ROOMENV.DAT) instead of walking into them. Zombies only.
Ps1ZombieNavigation=1
; PS1 stumble: a chasing zombie can trip forward and get back up (about 1 in 20 approaches).
Ps1ZombieStumble=1
